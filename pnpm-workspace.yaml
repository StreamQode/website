# pnpm settings (moved here from package.json's "pnpm" field in pnpm 10+).
# Allow esbuild's install script to run so it fetches its native binary —
# Nuxt/Vite need it. Applies locally and on Vercel.
allowBuilds:
  esbuild: true
overrides:
  brace-expansion@>=2.0.0 <2.1.3: ^2.1.3
  brace-expansion@>=2.0.0 <2.1.4: ^2.1.4
  brace-expansion@>=4.0.0 <5.0.8: ^5.0.8
  brace-expansion@>=4.0.0 <5.0.9: ^5.0.9
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
  svgo@>=4.0.0 <4.1.0: ^4.1.0
